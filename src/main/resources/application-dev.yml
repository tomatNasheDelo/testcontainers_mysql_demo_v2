spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/app_demo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:demo}
    password: ${DB_PASSWORD:demo_local_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: false

app:
  demo-data:
    enabled: true
