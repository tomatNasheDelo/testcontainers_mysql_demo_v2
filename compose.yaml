services:
  mysql:
    image: mysql:8.4
    container_name: mysql_demo_v2_dev
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: app_demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: ${DB_PASSWORD:-demo_local_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
